<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sermon Helper needs your input</title>
<style>*{box-sizing:border-box}
body{margin:0;background:#fff;color:#5d5d60;
font:400 14px/1.6 'Barlow', system-ui, sans-serif}
.banner{background:#eef2f7;color:#31506f;
font:400 11.5px/1.5 ui-monospace, Menlo, monospace;padding:9px 16px;text-align:center}
main{max-width:560px;margin:0 auto;padding:28px 20px 48px}
h1{font:600 28px/1.2 'Barlow Condensed', system-ui, sans-serif;margin:0;color:#1d1f20}
.lede{color:#7a7a7d;margin:6px 0 0}
.centred{text-align:center}
.badge{display:inline-grid;place-items:center;width:30px;height:30px;
background:#5980a6;color:#fff;font:600 15px 'Barlow Condensed', system-ui, sans-serif}
.field{margin-top:18px}
.label{font:400 10.5px ui-monospace, Menlo, monospace;letter-spacing:.08em;
text-transform:uppercase;color:#98989b;display:block}
input[type=text],textarea{width:100%;margin-top:6px;padding:9px 11px;
border:1px solid rgba(29, 31, 32, 0.16);font:inherit;color:inherit;background:#fff}
textarea{min-height:96px}
.drop{margin-top:6px;border:1px dashed #5980a6;background:#eef2f7;
padding:18px;text-align:center;color:#31506f}
.drop.off{border-color:rgba(29, 31, 32, 0.16);background:#fff;color:#7a7a7d}
.choice{margin-top:6px;display:flex;gap:16px}
.note{color:#7a7a7d;font-size:13px;margin:6px 0 0}
button{margin-top:24px;background:#5980a6;color:#fff;border:0;
font:600 13px 'Barlow Condensed', system-ui, sans-serif;letter-spacing:.05em;padding:11px 20px;
cursor:pointer}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;
justify-content:center;margin-top:18px;font:400 11px ui-monospace, Menlo, monospace}
.chip{border:1px solid rgba(29, 31, 32, 0.16);padding:5px 9px;color:#7a7a7d}
.chip.now{border-color:#5980a6;background:#eef2f7;
color:#31506f}
.arrow{color:#98989b}
</style>
</head>
<body>
<div class="banner">secure form · personal signed link for sam@hillsong.io — no sign-in exists · run wf_81c2 sleeps until you submit</div>
<main>
<h1>Sermon Helper needs your input</h1>
<p class="lede">Collect the sermon notes</p>
<form method="post" action="/f/tok-form">
<div class="field" data-field="urgent">
<label class="label" for="f-urgent">Is this urgent?</label>
<div class="choice"><label><input type="radio" id="f-urgent" name="urgent" value="yes" required> Yes</label><label><input type="radio" name="urgent" value="no"> No</label></div>
</div>
<div class="field" data-field="details" data-show-if="{&quot;fieldId&quot;:&quot;urgent&quot;,&quot;op&quot;:&quot;eq&quot;,&quot;value&quot;:true}">
<label class="label" for="f-details">What is the deadline?</label>
<textarea id="f-details" name="details" required></textarea>
</div>
<button type="submit">Submit &amp; resume the workflow</button>
</form>
</main>
<script>(function () {
  var form = document.querySelector('form');
  if (!form) return;

  var groups = [];
  document.querySelectorAll('[data-show-if]').forEach(function (node) {
    var controls = [];
    node.querySelectorAll('input, select, textarea').forEach(function (el) {
      controls.push({ el: el, required: el.required, disabled: el.disabled });
    });
    groups.push({ node: node, controls: controls });
  });

  function answer(id) {
    var field = form.elements[id];
    return field ? String(field.value || '') : '';
  }

  function holds(rule) {
    var got = answer(rule.fieldId);
    var want = rule.value;
    if (typeof want === 'boolean') want = want ? 'yes' : 'no';
    switch (rule.op) {
      case 'exists':
      case 'nonempty':
        return got !== '';
      case 'eq':
        return got === String(want);
      case 'neq':
        return got !== String(want);
      case 'gt':
        return Number(got) > Number(want);
      case 'gte':
        return Number(got) >= Number(want);
      case 'lt':
        return Number(got) < Number(want);
      case 'lte':
        return Number(got) <= Number(want);
      default:
        return true;
    }
  }

  function apply() {
    groups.forEach(function (group) {
      var show = holds(JSON.parse(group.node.dataset.showIf));
      group.node.hidden = !show;
      group.controls.forEach(function (each) {
        each.el.required = show && each.required;
        each.el.disabled = !show || each.disabled;
      });
    });
  }

  form.addEventListener('input', apply);
  form.addEventListener('change', apply);
  apply();
})();</script>
</body>
</html>
